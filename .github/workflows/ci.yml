name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.project }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [condmat-trend-radar, lab_paper_intake]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Radar regression tests
        if: matrix.project == 'condmat-trend-radar'
        run: python -m unittest discover -s tests -v
      - name: Intake regression tests
        if: matrix.project == 'lab_paper_intake'
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: condmat-trend-radar/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: condmat-trend-radar/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
